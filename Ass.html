<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking</title>
    <link rel="stylesheet" href="Ass.css">
</head>
<body>

<div class="main">

    <div class="container1">
        <div class="profile">
            <img src="Bean.jpg" alt="">
            <p>Report For</p>
            <h1>Jeremy<br>Robson</h1>
        </div>

        <div class="menu">
            <p>Daily</p>
            <p class="active">Weekly</p>
            <p>Monthly</p>
        </div>
    </div>

    
    <div class="card-grid">

        <div class="box work">
            <div class="inner">
                <h4>work    ...</h4>
                <h1>32hrs</h1>
                <p>Last Week - 36hrs</p>
            </div>
        </div>

        <div class="box play">
            <div class="inner">
                <h4>play</h4>
                <h1>10hrs</h1>
                <p>Last Week - 8hrs</p>
            </div>
        </div>

        <div class="box study">
            <div class="inner">
                <h4>study</h4>
                <h1>4hrs</h1>
                <p>Last Week - 7hrs</p>
            </div>
        </div>

        <div class="box exercise">
            <div class="inner">
                <h4>Exercise</h4>
                <h1>4hrs</h1>
                <p>Last Week - 5hrs</p>
            </div>
        </div>

        <div class="box social">
            <div class="inner">
                <h4>social</h4>
                <h1>5hrs</h1>
                <p>Last Week - 10hrs</p>
            </div>
        </div>

        <div class="box selfcare">
            <div class="inner">
                <h4>self care</h4>
                <h1>2hrs</h1>
                <p>Last Week - 2hrs</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
