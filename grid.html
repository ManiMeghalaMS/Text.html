<body>
    <h2>Example for Basic grid structure</h2>

        <div class="item">1</div>

        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>






    <h3>using fr unit(fractioanal space)</h3>

    <div class="container1">
        <div class="item1">A</div>
        <div class="item1">B</div>
        <div class="item1">C</div>
    </div>


<h2> Example for same fractional unit</h2>
<div class="container2">

    <div class="box">column 10</div>

</div>

 <h1>Responsive grid(auto-fit+minimax)</h1>
<div class="container3">
    <div class="box1">item1</div>
    <div class="box1">item2</div>
    <div class="box1">item3</div>
    <div class="box1">item4</div>

 </div>
