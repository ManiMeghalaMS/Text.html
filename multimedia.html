<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Example</title>
</head>
<body>
    <h3>Example for multimedia elements</h3>

    
    <h3>Example for image</h3>
    <img src="image.png" alt="Image of Shin Chan" width="200" height="500"><br><br>

    
    <h3>Example for video</h3>
    <video width="500" height="500" controls autoplay>
        <source src="video.mp4" type="video/mp4">
       
    </video><br><br>

   
    <h5>YouTube video</h5>
    <iframe width="500" height="200" src="https://www.youtube.com/embed/0mUDlFhz4TE" frameborder="20" allowfullscreen title="YouTube video"></iframe>



    <h3>Example for audio tag</h3>
<audio controls loop autoplay>
  <source src="audio.mp3" type="audio/mp3">
  
</audio>



</body>

</html>
